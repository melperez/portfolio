<!doctype html>
<!-- Source for public/og-image.png (1200x630 social preview). Regenerate with `npm run og`. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
      background: #f6f4ef; color: #2d2d30; font-family: "Segoe UI", Helvetica, Arial, sans-serif; border-top: 14px solid #a24b46; }
    .tag { font: 600 22px/1 Consolas, "Courier New", monospace; color: #a24b46; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 28px; }
    h1 { font-size: 84px; line-height: 1; margin: 0 0 22px; font-weight: 700; letter-spacing: -1px; }
    .role { font-size: 38px; margin: 0 0 44px; color: #55555a; }
    ul { display: flex; gap: 16px; margin: 0; padding: 0; list-style: none; }
    li { font: 500 24px/1 Consolas, "Courier New", monospace; padding: 14px 20px; border: 2px solid #2d2d30; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <p class="tag">// Portfolio</p>
  <h1>Melissa Pérez Cadavid</h1>
  <p class="role">Senior .NET &amp; Full-Stack Developer · 10+ years</p>
  <ul><li>.NET / C#</li><li>Azure · GCP · AWS</li><li>React · Angular</li><li>Applied AI</li></ul>
</body>
</html>
